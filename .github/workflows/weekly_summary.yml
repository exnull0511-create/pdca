name: 競輪予想 収支レポート

on:
  schedule:
    - cron: '30 12 * * *'   # 日次: 毎日 21:30 JST (UTC 12:30)
    - cron: '0 0 * * 1'     # 週次: 毎週月曜 09:00 JST (UTC 0:00)
    - cron: '0 0 1 * *'     # 月次: 毎月1日 09:00 JST (UTC 0:00)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily / weekly / monthly'
        required: true
        default: 'daily'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_cloud.txt

      - name: Install dependencies
        run: pip install -r requirements_cloud.txt

      # 日次レポート（毎日21時 or 手動）
      - name: 日次レポート
        if: github.event.schedule == '30 12 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily')
        env:
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_STATS: ${{ secrets.DISCORD_WEBHOOK_STATS }}
        run: python stats_summary.py daily

      # 週次レポート（毎週月曜 or 手動）
      - name: 週次レポート
        if: github.event.schedule == '0 0 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'weekly')
        env:
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_STATS: ${{ secrets.DISCORD_WEBHOOK_STATS }}
        run: python stats_summary.py weekly

      # 月次レポート（毎月1日 or 手動）
      - name: 月次レポート
        if: github.event.schedule == '0 0 1 * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'monthly')
        env:
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_STATS: ${{ secrets.DISCORD_WEBHOOK_STATS }}
        run: python stats_summary.py monthly
