name: 競輪予想 朝セッション (Morning)

on:
  schedule:
    - cron: "0 23 * * *"   # 毎日 8:00 JST (UTC 23:00 前日)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run モード (sleep省略・Discord送信なし)"
        required: false
        default: "false"

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストールする
        run: pip install -r requirements_cloud.txt

      - name: Git設定 (スクリプト内 push 用)
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name  "GitHub Actions"

      - name: 朝セッション実行 (8:00〜14:30 のレース担当)
        env:
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_FREE: ${{ secrets.DISCORD_WEBHOOK_FREE }}
          DB_SLIM_PATH:  data/S級DB_slim.xlsx
          DB_OLD_PATH:   "data/S級選手究極DB(1).xlsx"
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Tokyo
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python -u race_day.py --session morning $DRY_FLAG

      - name: bets_log 最終保存 (フォールバック)
        if: always()
        run: |
          git pull --rebase origin main || true
          git add data/bets_log.csv
          git diff --cached --quiet || git commit -m "chore: bets_log update (morning)"
          git push || true
