name: 競輪予想 自動通知

on:
  schedule:
    # バックアップcron: cron-job.orgが止まっても5分以内に起動 (JST 9:00〜21:00 = UTC 0:00〜12:00)
    - cron: '*/5 0-12 * * *'
  workflow_dispatch:    # cron-job.org から毎分トリガー / 手動実行ボタンも使用可

permissions:
  contents: write       # bets_log.csv の push に必要

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ① リポジトリをチェックアウト（data/ フォルダ含む）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ② Python セットアップ
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_cloud.txt

      # ③ 依存パッケージインストール
      - name: Install dependencies
        run: pip install -r requirements_cloud.txt

      # ④ 予想 & Discord通知
      - name: Run prediction and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DB_SLIM_PATH: data/S級DB_slim.xlsx
          DB_OLD_PATH:  data/S級選手究極DB(1).xlsx
        run: python check_and_notify.py

      # ⑤ bets_log.csv を commit & push（変更があれば）
      - name: Save bets log
        run: |
          git config user.email "bot@noreply.github.com"
          git config user.name "競輪予想Bot"
          git add data/bets_log.csv || true
          git diff --staged --quiet || git commit -m "auto: bets_log更新 $(date +'%Y-%m-%d %H:%M')"
          git push || true
